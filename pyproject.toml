[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffusionkit"
version = "0.1.0"
description = "Classical single-particle track analysis with explicit localization errors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "polars",
    "scipy",
]

[project.optional-dependencies]
bayes = ["jax", "numpyro", "tqdm"]
plots = ["matplotlib", "seaborn", "pandas"]
# Historical anisotropy workflow; not part of the rebuilt classical core.
nested = ["jaxns>2.5", "jax", "numpyro", "tqdm", "matplotlib", "seaborn", "pandas"]

[tool.hatch.build.targets.wheel]
packages = ["diffusionkit"]

[tool.hatch.build.targets.sdist]
# Keep the sample datasets and committed run outputs out of the distribution;
# they are ~11 MB and are only needed to reproduce the study from a clone.
exclude = ["*.csv", "results/", "graphify-out/", "notes.org"]
