[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffusionkit"
version = "0.1.0"
description = "MSD and Bayesian diffusion-coefficient/anisotropy analysis for single-particle-tracking data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "scipy",
    "matplotlib",
    "seaborn",
    "jax",
    "numpyro",
    "tqdm",
]

[project.optional-dependencies]
# Nested sampling, for the validation/oracle scripts only -- an independent
# evidence estimate that stays reliable on long, informative tracks, where the
# prior-predictive Monte Carlo in bayes/bayes_factor.py does not (see
# FINDINGS.md). The production estimators never import it, so it stays out of
# the core dependency set.
nested = ["jaxns>2.5"]

[tool.hatch.build.targets.wheel]
packages = ["diffusionkit"]

[tool.hatch.build.targets.sdist]
# Keep the sample datasets and committed run outputs out of the distribution;
# they are ~11 MB and are only needed to reproduce the study from a clone.
exclude = ["*.csv", "results/", "graphify-out/", "notes.org"]
